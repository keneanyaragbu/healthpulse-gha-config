apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: healthpulse-uat
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/keneanyaragbu/healthpulse-gha-config.git
    targetRevision: main
    path: k8s/overlays/uat
  destination:
    server: https://kubernetes.default.svc
    namespace: healthpulse-uat
  syncPolicy:
    # UAT = NO automated block → MANUAL sync (promotion gate via PR + manual sync)
    syncOptions:
      - CreateNamespace=true
