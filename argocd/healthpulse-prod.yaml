apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: healthpulse-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/keneanyaragbu/healthpulse-gha-config.git
    targetRevision: main
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: healthpulse-prod
  syncPolicy:
    # PROD = NO automated block → MANUAL sync (strictest gate)
    syncOptions:
      - CreateNamespace=true
