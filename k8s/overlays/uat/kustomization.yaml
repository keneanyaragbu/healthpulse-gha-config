apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

nameSuffix: -uat
namespace: healthpulse-uat

resources:
  - ../../base

images:
  - name: 588738574057.dkr.ecr.us-east-1.amazonaws.com/healthpulse-backend
    newTag: c25e24ff57ef1ad6382e18f903cde474960af4d9

patches:
  - target:
      kind: Namespace
      name: healthpulse
    patch: |-
      - op: replace
        path: /metadata/name
        value: healthpulse-uat
  - target:
      kind: HorizontalPodAutoscaler
      name: healthpulse-backend-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 4
  - target:
      kind: HorizontalPodAutoscaler
      name: healthpulse-web-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 4
