apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: splunk-token
  namespace: observability
spec:
  secretStoreRef:
    name: aws-secrets
    kind: ClusterSecretStore
  target:
    name: splunk-token          # the K8s Secret ESO creates
  data:
    - secretKey: token           # key inside the K8s secret
      remoteRef:
        key: healthpulse/splunk-ingest-token   # the Secrets Manager secret
