apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-github-pat
  namespace: arc-systems
spec:
  secretStoreRef:
    name: aws-secrets
    kind: ClusterSecretStore
  target:
    name: github-pat
  data:
    - secretKey: github_token
      remoteRef:
        key: healthpulse/github-arc-pat
